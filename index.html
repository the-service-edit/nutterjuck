<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NutterJuck Lures</title>
<meta name="description" content="NutterJuck Lures — handmade fishing lures.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#fff;
    --paper:#000;
    --gap:clamp(1.5rem,5vw,4rem);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Archivo',sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    min-height:100dvh;
    overflow-x:hidden;
  }

  /* thin frame that nods to a label/tag */
  .frame{
    position:fixed;
    inset:clamp(12px,2.2vw,22px);
    border:1.5px solid var(--ink);
    pointer-events:none;
    z-index:1;
  }
  .corner{
    position:fixed;
    font-family:'Archivo',sans-serif;
    font-size:.7rem;
    letter-spacing:.32em;
    text-transform:uppercase;
    z-index:2;
    opacity:0;
    animation:fade 1s ease forwards .9s;
  }
  .corner.tl{top:clamp(20px,3vw,34px);left:clamp(22px,3.4vw,40px)}
  .corner.tr{top:clamp(20px,3vw,34px);right:clamp(22px,3.4vw,40px)}
  .corner.bl{bottom:clamp(20px,3vw,34px);left:clamp(22px,3.4vw,40px)}
  .corner.br{bottom:clamp(20px,3vw,34px);right:clamp(22px,3.4vw,40px)}

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:6rem 1.5rem;
    position:relative;
    z-index:1;
  }

  .logo{
    width:min(46vw,360px);
    height:auto;
    opacity:0;
    transform:translateY(14px);
    animation:rise 1.1s cubic-bezier(.2,.7,.2,1) forwards .15s;
  }

  .tagline{
    margin-top:2.2rem;
    font-size:.74rem;
    letter-spacing:.42em;
    text-transform:uppercase;
    opacity:0;
    animation:fade 1s ease forwards .7s;
  }

  .cta{
    --pad:1.05rem;
    display:inline-block;
    margin-top:clamp(2.6rem,6vw,3.6rem);
    font-family:'Anton',sans-serif;
    font-size:clamp(1.05rem,2.6vw,1.4rem);
    letter-spacing:.14em;
    text-transform:uppercase;
    text-decoration:none;
    color:var(--paper);
    background:var(--ink);
    padding:var(--pad) clamp(2.2rem,6vw,3.4rem);
    border:1.5px solid var(--ink);
    position:relative;
    overflow:hidden;
    opacity:0;
    transform:translateY(10px);
    animation:rise 1s cubic-bezier(.2,.7,.2,1) forwards 1s;
    transition:color .45s ease;
    z-index:0;
  }
  .cta::before{
    content:"";
    position:absolute;
    inset:0;
    background:var(--paper);
    transform:translateY(101%);
    transition:transform .45s cubic-bezier(.7,0,.2,1);
    z-index:-1;
  }
  .cta:hover{color:var(--ink)}
  .cta:hover::before{transform:translateY(0)}
  .cta:focus-visible{outline:2px solid var(--ink);outline-offset:4px}

  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  @keyframes fade{to{opacity:1}}

  @media (max-width:600px){
    .corner{display:none}
    .logo{width:64vw}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;opacity:1!important;transform:none!important}
  }
</style>
</head>
<body>
  <div class="frame" aria-hidden="true"></div>

  <main>
    <img class="logo" src="logo.png" alt="NutterJuck Lures logo">
    <p class="tagline">Simple but done well</p>
    <a class="cta" href="products.html">Shop the Lures</a>
  </main>
</body>
</html>
