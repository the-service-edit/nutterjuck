  .specs li span:last-child{font-size:.9rem;font-weight:500;text-align:right}

  .buy::before{content:"";position:absolute;inset:0;background:var(--paper);transform:translateY(101%);transition:transform .4s cubic-bezier(.7,0,.2,1);z-index:-1}
  .buy:hover{color:var(--ink)}
  .buy:hover::before{transform:translateY(0)}
  .buy:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .prevnext{display:flex;justify-content:space-between;gap:1rem;border-bottom:1.5px solid var(--ink);padding:1.1rem clamp(1.4rem,5vw,4rem)}
  .prevnext a{font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;text-decoration:none;color:var(--ink);border-bottom:1.5px solid transparent;padding-bottom:2px;transition:border-color .3s ease}

  footer{border-top:1.5px solid var(--ink);text-align:center;padding:2.2rem 1.5rem;font-size:.68rem;letter-spacing:.3em;text-transform:uppercase}
  footer a{color:var(--ink)}
  .credit{display:block;margin-top:1rem;font-size:.6rem;letter-spacing:.28em;opacity:.55}
  .credit a{text-decoration:none;border-bottom:1px solid transparent;padding-bottom:1px;transition:border-color .3s ease}
  .credit a:hover{border-color:var(--ink)}

  @media (max-width:760px){
    .product{grid-template-columns:1fr}
    .media{border-right:none;border-bottom:1.5px solid var(--ink);min-height:auto;aspect-ratio:1/1}

  @media (max-width:560px){.wordmark span{display:none}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
